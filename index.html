<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRO Study Guide</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16202e;--mute:#5a6576;--line:#d9dee6;--acc:#1f3f74;--acc2:#2f5aa3;--accInk:#fff;--pass:#1d7a46;--passBg:#e3f4ea;--fail:#b3261e;--failBg:#fbe7e5;--warn:#9a6200;--warnBg:#fff3d6;--say:#eef3fb;--sayInk:#163764}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b6;--line:#2b3644;--acc:#7fa6e6;--acc2:#a7c3f0;--accInk:#0f141b;--pass:#5fd28f;--passBg:#143322;--fail:#ff8a80;--failBg:#3a1714;--warn:#f0c060;--warnBg:#3a2d0c;--say:#1c2a40;--sayInk:#cfe0ff}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b6;--line:#2b3644;--acc:#7fa6e6;--acc2:#a7c3f0;--accInk:#0f141b;--pass:#5fd28f;--passBg:#143322;--fail:#ff8a80;--failBg:#3a1714;--warn:#f0c060;--warnBg:#3a2d0c;--say:#1c2a40;--sayInk:#cfe0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc);color:var(--accInk);padding:14px 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15rem;letter-spacing:.02em}
header .sub{font-size:.8rem;opacity:.85}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav button{background:transparent;border:0;color:inherit;opacity:.8;padding:9px 12px;font:inherit;font-size:.92rem;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;border-bottom-color:currentColor;font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:1.25rem;margin:0 0 8px}h3{font-size:1.05rem;margin:14px 0 6px}
.mute{color:var(--mute)}.small{font-size:.86rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tasklist button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.tasklist button:hover{border-color:var(--acc2)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;background:var(--acc);color:var(--accInk);border-radius:5px;padding:1px 7px;margin-right:6px}
.say{display:inline-block;background:var(--say);color:var(--sayInk);border-left:3px solid var(--acc2);padding:2px 8px;border-radius:4px;font-style:italic;margin:2px 0}
.script{background:var(--say);color:var(--sayInk);padding:10px 12px;border-radius:6px;font-size:.93rem}
.note{background:var(--warnBg);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:.88rem}
.study dt{font-weight:700;margin-top:10px}.study dd{margin:2px 0 0 0}
ul.tight,ol.tight{margin:4px 0;padding-left:22px}
.btn{background:var(--acc);color:var(--accInk);border:0;border-radius:7px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:5px 10px;font-size:.86rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table.tbl{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--mute);font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{background:var(--passBg);border-color:var(--pass);color:var(--pass)}
.opt.bad{background:var(--failBg);border-color:var(--fail);color:var(--fail)}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;font-weight:600;cursor:pointer;user-select:none}
.flash .back{font-size:1.05rem;font-weight:400}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:60px}
label{font-size:.85rem;color:var(--mute);display:block;margin-top:8px}
.meas{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.meas .txt{flex:1}
.pf{display:flex;gap:4px}
.pf button{width:40px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:700;cursor:pointer}
.pf button.P.on{background:var(--pass);color:#fff;border-color:var(--pass)}
.pf button.F.on{background:var(--fail);color:#fff;border-color:var(--fail)}
.badge{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:20px}
.badge.pass{background:var(--passBg);color:var(--pass)}.badge.fail{background:var(--failBg);color:var(--fail)}.badge.pend{background:var(--line);color:var(--mute)}
.brief{border:2px solid var(--acc2);border-radius:8px;padding:10px 12px;background:var(--say);color:var(--sayInk)}
.timer{font:700 1.8rem/1 ui-monospace,Consolas,monospace;padding:6px 12px;border-radius:8px;background:var(--say);color:var(--sayInk)}
.timer.out{background:var(--failBg);color:var(--fail)}
details{margin-top:8px}summary{cursor:pointer;font-weight:600;color:var(--acc)}
.lock{max-width:380px;margin:40px auto;text-align:center}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.prog>i{display:block;height:100%;background:var(--pass)}
#printArea{display:none}
@media print{body{background:#fff!important}header,main,.noprint{display:none!important}#printArea{display:block!important;color:#000;font:12px/1.4 Arial,sans-serif}#printArea table{border-collapse:collapse;width:100%}#printArea td,#printArea th{border:1px solid #888;padding:3px 5px}}
@media (max-width:560px){main{padding:12px}.card{padding:13px}}
</style>
</head>

   Items marked GP are general radio/safety practice added for clarity, not quoted from the task guide. */

    {id:"L-0001", t:"L-0001 Basic Communications Procedures for ES Operations"},
    {id:"L-0002", t:"L-0002 Perform Radio Operating Procedures"},

    {id:"L-0005", t:"L-0005 Choose a Good Communications Site"},
    {id:"L-0006", t:"L-0006 Take Steps to Regain Communications"},
    {id:"L-0007", t:"L-0007 Conduct Scheduled Radio Checks"},

    {id:"L-0010", t:"L-0010 Communications Safety Procedures"},
    {id:"P-0101", t:"P-0101 Demonstrate the Ability to Keep a Log"}

  {grp:"Exercise Participation", items:[
    {id:"EX1", t:"Exercise/mission #1 as MRO trainee", n:"Under direct supervision of a qualified supervisor; mission number recorded."},

  ]},
  {grp:"Continuing Education", items:[
    {id:"CAPT117", t:"CAPT 117 ES Continuing Education Exam – Part 3", n:"Absorb catalog."}
  ]}

const TASKS = [
{
 id:"L-0001", title:"Basic Communications Procedures for ES Operations",
 cond:"You are a member of the CAP mission staff performing a task in which the use of a radio is necessary.",
 obj:"Properly operate a CAP radio.",
 know:[
  "Demonstrate the proper method to contact another station.",
  "Demonstrate knowledge of call signs.",
  "Demonstrate knowledge of basic prowords (ROGER, OVER, OUT, AFFIRMATIVE…).",
  "Demonstrate ability to operate basic radio equipment (volume, squelch, channel).",
  "Demonstrate knowledge of prohibited practices (e.g., chit‑chat).",
  "Demonstrate knowledge of National communications policies, local operating practices, and region/wing/local policies."
 ],
 study:[
  ["Listen first","Before you key the mic, LISTEN to make sure the channel is clear. This is performance measure #1 — evaluators watch for it."],
  ["Calling format","Say the station you are calling, then “THIS IS”, then your call sign, then “OVER”.<br><span class='say'>“Mission Base, THIS IS Ground Team One, OVER.”</span>"],
  ["Answer format","<span class='say'>“Ground Team One, THIS IS Mission Base, OVER.”</span> (or “…Mission Base, go ahead, OVER.”)"],
  ["Close","When finished: <span class='say'>“…Ground Team One, OUT.”</span> Never say “over and out” — OVER expects a reply, OUT ends the exchange."],
  ["Prohibited practices","Chit‑chat / unnecessary transmissions, discussing frequencies on the air, unprofessional language, “Roger Wilco” (WILCO already includes ROGER), transmitting without identifying, interfering with other traffic."],
  ["Equipment","Know where volume, squelch, and channel selector are; know which channel is the local repeater and which is simplex."]
 ],
 setup:"Provide a basic radio (volume, squelch, channel controls) and at least one other radio/station. The exchange should go through several transmissions with questions and answers. Use the prowords ROGER, OVER, OUT, AFFIRMATIVE. Prohibited practices such as “chit‑chat” should be used or discussed.",
 brief:"You are at mission base and have been assigned the task of reporting when the director of the local office of emergency management arrives for his/her tour of the facility. Contact the other station and make that report.",
 measures:[
  "Listen before transmitting",
  "Demonstrate calling procedures including call signs",
  "Demonstrate use/understanding of basic prowords",
  "Demonstrate understanding of radio equipment including finding local repeater/simplex"
 ],
 key:[
  "Candidate pauses and listens before keying.",
  "Call: “[Station called], THIS IS [own call sign], OVER.” Waits for answer before passing traffic.",
  "Traffic, e.g.: “The Director of Emergency Management has arrived at the main entrance for the tour, OVER.”",
  "Uses ROGER / AFFIRMATIVE correctly when answering questions; ends with “OUT” (not “over and out”).",
  "Can show you the volume, squelch, channel controls and point out the repeater and simplex channels.",
  "Can name at least one prohibited practice (chit‑chat, discussing frequencies on air, etc.)."
 ]
},
{
 id:"L-0002", title:"Perform Radio Operating Procedures",
 cond:"You are a mission radio operator at a search/DR base.",
 obj:"Properly operate a mission base radio system.",
 know:[
  "Contact another station properly.",
  "International Phonetic Alphabet.",
  "CAP prowords.",
  "International urgency signals.",
  "Maintain a communications status board.",
  "Familiarity with standard equipment and local communications operations.",
  "Proper use of standard radio equipment: set volume & squelch; proper microphone use."
 ],
 study:[
  ["Why it matters","The MRO maintains communications with all mission assets (aircraft, ground teams, flight line, forward bases) to send new instructions, report mission information, and keep track of people in the field for safety."],
  ["Volume & squelch (GP)","Turn squelch down (open) until you hear background noise, then turn it up just until the noise stops. Set volume to a comfortable level. Too much squelch = you miss weak stations."],
  ["Microphone technique (GP)","Hold the mic 1–2 inches from your mouth, slightly to the side. Press to talk (PTT), pause about a second, speak clearly at normal volume, then release to listen (RTL). Think before you transmit."],
  ["Calling an aircraft","<span class='say'>“CAP Two Eight One Seven, THIS IS Mission Base, OVER.”</span> Wait for the aircraft to answer, then pass the message."],
  ["Grid change (example)","<span class='say'>“CAP Two Eight One Seven, Mission Base. New assignment: proceed to grid Washington One Zero Two Charlie. I say again, grid Washington One Zero Two Charlie. Read back, OVER.”</span> Use phonetics for letters, pronounce numbers digit by digit (NINER, FIFE, TREE…)."],
  ["Urgency signals","<b>MAYDAY</b> (said 3 times) = DISTRESS – grave and imminent danger, immediate help needed.<br><b>PAN‑PAN</b> (said 3 times) = URGENCY – urgent safety situation, not immediate danger.<br><b>SECURITE</b> = safety information."],
  ["Action on MAYDAY / PAN‑PAN (GP)","Stop all other transmissions and keep the channel clear • copy EVERYTHING (who, where, what's wrong, help needed, persons on board) • log the time • notify the Communications Unit Leader / Incident Commander immediately • acknowledge and relay as directed. The MRO passes the information — decision makers decide."],
  ["Status board","Post the current status of every resource so all who need it can see it: call sign, assignment/grid, departure time, last check‑in, next check due, location, status. Update it every time something changes (e.g., the grid change you just sent)."]
 ],
 setup:"Provide the student with a message to reassign an aircraft to another grid, a status board, a radio, paper and pencil/pen.",

 measures:[
  "Demonstrate setting volume and squelch levels for proper function",
  "Demonstrate proper microphone technique",
  "Demonstrate listening before transmitting",
  "Properly call and acknowledge aircraft",
  "Send change of grid assignment, using proper phonetics and prowords",
  "Correctly interpret urgency signal and take appropriate action",
  "Update mission communications status boards"
 ],
 key:[
  "Squelch: opened until noise heard, raised just to quiet; volume comfortable.",
  "Mic close to mouth, PTT – pause – speak – RTL; clear, unhurried speech.",
  "Listens before every call.",
  "“[Aircraft call sign], THIS IS Mission Base, OVER.” Acknowledges the aircraft's reply.",
  "Letters in phonetics, numbers digit‑by‑digit (“One Zero Two”), asks for read back.",
  "MAYDAY = distress / PAN‑PAN = urgency. Action: clear the channel, copy all info, log time, notify CUL/IC immediately.",
  "Status board changed to show new grid and time."
 ],
 scenario:"grid"
},
{
 id:"L-0003", title:"Employ Appropriate Radio Frequencies and Repeaters",
 cond:"You are the radio operator, and have been told to contact another station. You must choose what frequency to use.",
 obj:"Within 2 minutes, identify the appropriate frequencies and channels used for operations.",
 timer:120,
 know:[
  "Simplex (VHF‑FM): short‑range; units transmit and receive on the same frequency.",
  "Duplex (repeater): longer range through a repeater; accessed by sending a subaudible tone. Per the task guide, a 100.0 Hz tone activates any CAP repeater but is used only in emergencies and to request the proper tone; the Communications Unit Leader briefs which frequencies/tones to use.",
  "VHF‑AM (Airband) SAR frequencies: dedicated frequencies authorized for training and actual missions, accessible by any aircraft.",
  "National HF frequencies: coordinated by National HQ; HF teams may serve as relay points out of disaster areas.",
  "Region HF frequencies: for HF operations within a region; longer range than VHF‑FM.",
  "Other frequencies: police, Coast Guard, other SAR agencies — the Communications Unit Leader briefs their use."
 ],
 study:[
  ["Who assigns frequencies?","The <b>Communications Unit Leader</b> assigns frequencies and briefs repeater tones."],
  ["The five groups","1) Simplex VHF‑FM 2) Duplex/repeaters 3) VHF‑AM airband SAR 4) National HF 5) Region HF (+ other‑agency frequencies)."],
  ["What you must identify","Primary simplex • Alternate simplex • Primary duplex pair • Alternate duplex pair • Primary HF‑SSB (region) • Alternate HF‑SSB (region) — each with its USE — all within <b>2 minutes</b>."],
  ["Cheat sheet allowed!","The student may use any item from field gear, including the task book or a cheat sheet. Bring your wing comms plan / channel list and practice reading it fast."],
  ["Airband SAR (reference)","123.1 MHz is used for actual SAR missions; 122.9 MHz is used for training (per CAP wing comms references). Do not use airband SAR frequencies for ground‑to‑ground CAP business."],
  ["Be a good neighbor","If you can clearly reach the team on simplex, don't tie up the repeater — others may need it. Never discuss frequencies on the air."],
  ["References","CAPR 100‑1 (Communications) chapters 7, 9 & 10, the Communications Directory, and your Wing Communications Operations & Training plans. Check for the current CAPI 100‑1 edition."]
 ],
 setup:"Prepare a list of the five frequency groups for your area of operation with assignments in each group. Give the list to the trainee. The student may use any item from his field gear, including the task book or a “cheat sheet”.",
 brief:"Identify each frequency and its use. You have 2 minutes total.",
 measures:[
  "Identifies the primary simplex frequency and its use",
  "Identifies the alternate simplex frequency and its use",
  "Identifies the primary duplex frequency pair and its use",
  "Identifies the alternate duplex frequency pair and its use",
  "Identifies the primary HF SSB frequency for the region",
  "Identifies the alternate HF‑SSB frequency for the region",
  "Completes all steps within 2 minutes"
 ],
 key:["Compare answers to YOUR local frequency list (set it in Instructor ▸ Settings). Each answer must include the channel AND its use."],
 scenario:"freq"
},
{
 id:"L-0004", title:"Message Handling Procedures",
 cond:"You are a mission radio operator at a SAR/DR base.",
 obj:"Demonstrate the proper sending, receiving and distribution of formal and informal message traffic.",
 know:[
  "Send formal and informal messages.",
  "Explain the significance of message precedence.",
  "Fill out incoming message forms.",
  "Fill in a mission radio log.",
  "Receive and route a formal message."
 ],
 study:[
  ["Formal vs informal","<b>Informal</b> traffic is conversational and most common (e.g., “Have Ground Team One call the Ground Branch Director by phone”).<br><b>Formal</b> traffic is written on a message form and sent exactly as written — used when the exact wording matters or several stations must receive the same message the same way (e.g., a mission continuation message)."],
  ["Precedence","Precedence tells everyone how fast a message must be handled — higher precedence is handled first. The MRO usually doesn't set it (the originator does) but must understand it and may need to guide people preparing messages. Common scheme: FLASH › IMMEDIATE › PRIORITY › ROUTINE. Confirm the exact levels in current CAP comms guidance (CAPI 100‑1 / Radiotelephone Procedures Guide)."],
  ["ICS 213 – General Message","Fields: Incident name, TO (name/position), FROM (name/position), SUBJECT, DATE, TIME, MESSAGE, APPROVED BY, REPLY, REPLIED BY. Write clearly, then get it to the addressee promptly."],
  ["ICS 214 – Activity / Unit Log","The MRO keeps the communications unit log on an ICS 214: incident name, operational period, name, ICS position, home agency/unit, resources assigned, and time‑stamped notable activities, signed by the preparer."],
  ["Asking for a fill","If part of a formal message was missed, ask only for the missing part:<br><span class='say'>“SAY AGAIN ALL AFTER [word]”</span> • <span class='say'>“SAY AGAIN ALL BEFORE [word]”</span> • <span class='say'>“SAY AGAIN WORD AFTER [word]”</span> • <span class='say'>“SAY AGAIN ALL BETWEEN [word] AND [word]”</span><br>The sender answers: <span class='say'>“I SAY AGAIN ALL AFTER [word] …”</span>"],
  ["Distribute it","Your job isn't done when you copy it — log it, then deliver the message to the addressee (and file a copy) quickly. Accurate and timely."]
 ],
 setup:"Provide the student with a formal mission continuation message and an informal message for a ground team to contact the Ground Branch Director by telephone, message forms, a radio, paper and pencil/pen.",
 brief:"Send me the formal and informal messages. (Evaluator: ask for a fill on the formal message. Then send a formal message to the student, and an informal message to the student.)",
 measures:[
  "Properly send messages, using appropriate phonetics and prowords",
  "Properly handle a request for a fill on the formal message",
  "Properly fill out and distribute a message form",
  "Properly and completely fill out mission radio log"
 ],
 key:[
  "Formal message read exactly as written, at copy speed, unusual words spelled with “I SPELL”, numbers digit by digit.",
  "On a fill request (e.g., “SAY AGAIN ALL AFTER continues”) the student replies “I SAY AGAIN ALL AFTER continues …” — only the requested part.",
  "Incoming message copied onto ICS 213 completely (to, from, subject, date, time, message) and delivered/routed to addressee.",
  "Each message logged on the radio log / ICS 214 with time, station, and summary."
 ],
 scenario:"msg"
},
{
 id:"L-0005", title:"Choose a Good Communications Site",
 cond:"Given a scenario in which a team is deployed from base to a remote location.",
 obj:"Determine a good location to contact base by radio.",
 know:[
  "High ground — the higher you are, the farther your signal travels (fewer objects in the way).",
  "Line of sight — a clear path through the air to the other station. A high spot doesn't help if higher ground is still between you. Tall buildings, metal sheds and towers block signals.",
  "Accessibility — make sure you can actually get there (no locked gate, can drive/walk to it).",
  "Radio interference — avoid interference generators: (1) high power lines, (2) transformers, (3) underground cables."
 ],
 study:[

  ["Interference sources","High power lines • Transformers • Underground cables. You need to name <b>two</b>."],
  ["To pass","Name at least <b>three of the four</b> site factors and <b>two</b> sources of radio interference."]
 ],
 setup:"None.",
 brief:"Name at least three factors in choosing a good communications site, and two sources of radio interference.",
 measures:[

  "Identifies two radio interference sources"
 ],
 key:["Factors: high ground, line of sight, accessibility, radio interference.","Interference sources: high power lines, transformers, underground cables."]
},
{
 id:"L-0006", title:"Take Steps to Regain Communications",
 cond:"Given a radio and a situation where you must contact another unit or base by radio but cannot reach them.",
 obj:"Define correct procedures for re‑establishing a radio communications link.",
 know:[
  "a. Check the radio — battery good (meter, or listen for static with squelch off), antenna and hand mic connected and working; try another radio or battery.",
  "b. Move to higher ground — raises the antenna, improves line of sight.",

 study:[
  ["Why it happens","VHF‑FM is line‑of‑sight. Teams often end up on the “wrong” side of a mountain or in low areas."],

 ],
 setup:"None.",

},
{

 id:"L-0010", title:"Communications Safety Procedures",
 cond:"You are a mission radio operator at a search/DR base.",
 obj:"Explain the safety exposures and mitigation factors involved in operating a mission radio system.",
 know:[
  "List at least 5 safety rules for lightning protection.",
  "Proper routing and securing of cables and wires.",
  "Locating antenna systems to minimize RF exposure and EMI.",
  "Explain a proper grounding system."
 ],
 study:[
  ["Lightning rules (know 5 of 7)",
   "1) If you can hear thunder, you are close enough to be hit — seek safe shelter.<br>2) Properly ground all equipment when installed.<br>3) Disconnect antennas from radios when lightning is observed in the area.<br>4) Disconnect radios/power supplies from AC outlets when lightning is observed.<br>5) In a vehicle, don't stay in a high location that makes you a target (hilltop, large open field).<br>6) On foot, seek shelter: report to mission base (or any unit) that you're leaving the air due to lightning; move to a sturdy building or car. NOT small sheds, isolated trees, or convertibles.<br>7) On foot with no shelter: find a low spot away from trees, fences and poles, not subject to flooding. In woods, shelter under shorter trees."],
  ["Cables & wires (GP)","Route cables out of walkways and doorways; secure them (tape, cable covers, ties, or overhead); mark them so no one trips; keep power and coax tidy and away from water and heat; don't pinch them in doors or windows."],
  ["Antenna placement (GP)","Place antennas high and clear, away from where people sit, stand or walk (minimizes RF exposure); keep them away from other antennas and electronics (minimizes EMI); never where they could fall onto or touch power lines."],
  ["Grounding (GP)","Bond all equipment to a common, single‑point ground (ground rod or approved ground) with short, heavy conductors; use lightning arrestors on coax feed lines; follow the equipment manual and wing standards."],
  ["Reference","CAPR 100‑1 Vol. 1, Chapter 7 (check current CAPI 100‑1)."]
 ],

 brief:"Recite the safety rules for lightning protection (at least five). Explain proper routing and securing of wires and cables, how to properly locate an antenna system, and how to ground the equipment.",

  "Explain the proper routing and securing of wires and cables",
  "Explain how to properly locate antenna systems to maximize safety and minimize RF exposure and EMI",
  "Explain how to properly ground communications equipment"
 ],
 key:["Any 5 of the 7 lightning rules.","Cables out of traffic, secured, marked.","Antennas high/clear, away from people, other electronics and power lines.","Common single‑point ground, short heavy conductors, arrestors."]
},

const SCEN = {
 grid(){const cs="CAP "+r(1,9)+r(0,9)+r(0,9)+r(0,9);const sec=pick(["Washington","New York","Detroit","Cincinnati"]);const g=r(80,180);const q=pick(["Alfa","Bravo","Charlie","Delta"]);
  return `<b>Message to send:</b> Aircraft <b>${cs}</b> is reassigned from its current grid to <b>grid ${sec} ${g} ${q}</b>. Begin search on arrival, report entering grid.<br><b>Then transmit to candidate:</b> “PAN‑PAN, PAN‑PAN, PAN‑PAN, Mission Base, this is ${cs}, rough‑running engine, diverting to nearest airport, ${r(2,6)} souls on board, OVER.” Ask: what does it mean / what do you do?`;},
 freq(){const f=loadSettings().freq||{};const row=(k,l)=>`<tr><td>${l}</td><td>${esc(f[k]||"— set in Settings —")}</td></tr>`;
  return `<table class="tbl"><tr><th>Item</th><th>Your local assignment</th></tr>${row("s1","Primary simplex")}${row("s2","Alternate simplex")}${row("d1","Primary duplex pair")}${row("d2","Alternate duplex pair")}${row("h1","Primary HF‑SSB (region)")}${row("h2","Alternate HF‑SSB (region)")}${row("am","VHF‑AM SAR")}${row("oth","Other agencies")}</table>`;},
 msg(){const m="26‑M‑"+r(1000,9999);const t=pad(r(15,21))+"00";
  return `<b>Formal message (candidate sends):</b> FROM Incident Commander TO Wing Director of Operations — SUBJECT Mission Continuation — “Mission ${m} continues through ${t} local. Two aircraft and three ground teams remain committed. Next update at ${pad((+t.slice(0,2)+2)%24)}00 local.”<br><b>Ask for a fill:</b> “SAY AGAIN ALL AFTER continues.”<br><b>Informal message (candidate sends):</b> “Ground Team ${r(1,4)}, contact the Ground Branch Director by telephone at your earliest opportunity.”<br><b>You send to candidate (formal):</b> FROM Planning Section Chief TO Communications Unit Leader — “Change shift at ${pad(r(6,9))}00 local tomorrow. Two radio operators required at mission base.”<br><b>You send (informal):</b> “Mission Base, please advise Flight Line that CAP ${r(1000,9999)} is ten minutes out.”`;},
 check(){const now=new Date(Date.now()+5*60000);const due=pad(now.getHours())+pad(now.getMinutes());
  return `<b>Check due at:</b> ${due} (5 min from now)<br><b>Hidden info (read only if asked):</b> Location: ${pick(["grid right one point three, up two point two","N40° 25.3′ W075° 47.8′","the north end of the fire road at the power line crossing"])}. Since last check: ${pick(["searched line abreast along the creek, no clues","completed hasty search of the trail system, no clues","interviewed two hikers, no sightings"])}. Now: ${pick(["continuing search pattern","moving to the next segment","taking a 20‑minute meal break"])}.`;},
 pos(){const la=r(39,41),lo=r(74,77);return `<b>Marked position:</b> N${la}° ${r(10,59)}.${r(0,9)}′, W0${lo}° ${r(10,59)}.${r(0,9)}′<br>Candidate call sign: <b>Ground Team ${r(1,5)}</b> — Remote station: <b>Mission Base</b>.`;},
 clue(){const c=pick([
  ["One red backpack, zipper closed, with name tag reading “J. Smith”","Left in place, marked with flagging tape","1"],
  ["One adult hiking boot, left foot, size 10, brown leather, wet","Bagged, location marked with GPS waypoint and flagging","5, 7"],
  ["Fresh footprints, two sets, one adult and one child, heading north on the trail","Marked and photographed, not disturbed","7"],
  ["One female adult located, conscious, alert, complaining of ankle pain, unable to walk","Team providing first aid on scene","2"],
  ["Aircraft wreckage, single‑engine, white with blue stripe, no movement observed","Area secured, nothing touched","2, 3, 5"]]);
  return `<b>Clue:</b> ${c[0]}<br><b>Location:</b> N${r(39,41)}° ${r(10,59)}.${r(0,9)}′ W0${r(74,77)}° ${r(10,59)}.${r(0,9)}′<br><b>Status:</b> ${c[1]}<br><b>Resources needed:</b> ${c[2]}`;},
 log(){let t=r(7,9)*60+r(0,59);const ev=["Team departs mission base, odometer "+r(12000,90000),"Arrive at search area; begin hasty search of segment "+pick(["A","B","C"]),"Scheduled radio check with mission base, all OK","Search line changes direction to north along creek","Interviewed landowner; reports hearing a whistle last night","Clue found: blue glove at trail junction; reported to base","Team member twisted ankle; first aid given, continuing","Local police officer arrives, asks team to avoid private property to the east","Reporter approaches team; referred to Public Information Officer","Leave search area; return route via Route "+r(10,422),"Arrive mission base, odometer +"+r(20,60)+" miles; team debrief"];
  return "<ol class='tight'>"+ev.slice(0,10).map(e=>{t+=r(8,35);return `<li><b>${pad(Math.floor(t/60)%24)}${pad(t%60)}</b> – ${e}</li>`}).join("")+"</ol>";}
};
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function pad(n){return String(n).padStart(2,"0")}

<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function LS(k,v){try{if(v===undefined){const x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function loadSettings(){return LS("mro_settings")||{}}

/* --- compact SHA-256 (no WebCrypto needed for offline/file contexts) --- */
function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}const mp=Math.pow,mw=mp(2,32);let res="",words=[],bl=ascii.length*8,hash=[],k=[],pc=0,isC={};
 ascii=unescape(encodeURIComponent(ascii));bl=ascii.length*8;
 for(let c=2;pc<64;c++){if(!isC[c]){for(let i=0;i<313;i+=c)isC[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
 hash=hash.slice(0,8);ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
 for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((bl/mw)|0);words[words.length]=bl;
 for(let j=0;j<words.length;){const w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
  for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
  for(let i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}
 for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;res+=((b<16)?0:"")+b.toString(16)}return res}
const DEFAULT_PW="MRO-EVAL";
function pwHash(){return loadSettings().pw||sha256("mro:"+DEFAULT_PW)}

function vHome(m){
 m.innerHTML=`<div class="card"><h2>Getting ready for your MRO sign‑off</h2>
 <p>The Mission Radio Operator SQTR has <b>11 hands‑on tasks</b> (L‑0001 to L‑0010 and P‑0101). For each one an evaluator sets up a situation, briefs you, and scores you <b>Pass/Fail</b> on every performance measure. <b>You must pass every measure</b>; if you miss one, the evaluator shows you what was wrong and how to do it correctly.</p>
 <div class="row"><button class="btn" onclick="go('study')">Study the tasks</button><button class="btn sec" onclick="go('quiz')">Take a practice quiz</button><button class="btn sec" onclick="go('ref')">Quick reference</button></div></div>
 <div class="card"><h2>SQTR checklist</h2>${SQTR.map(g=>`<h3>${g.grp}</h3><ul class="tight">${g.items.map(i=>`<li><b>${esc(i.t)}</b>${i.n?` <span class="mute small">— ${esc(i.n)}</span>`:""}</li>`).join("")}</ul>`).join("")}</div>
 <div class="card"><h2>Five habits evaluators look for</h2><ol class="tight">
 <li><b>Listen before you transmit</b> — every time.</li><li><b>“[Them], THIS IS [you], OVER.”</b> — call signs in the right order.</li>

}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(task){const pool=QUIZ.filter(q=>!task||task==="all"||q.t===task);const n=task&&task!=="all"?pool.length:Math.min(20,pool.length);
 quiz={task:task||"all",qs:shuffle(pool).slice(0,n).map(q=>{const o=shuffle(q.c.map((c,i)=>({c,ok:i===q.a})));return{...q,o}}),i:0,score:0,ans:null};VIEW="quiz";render();scrollTo(0,0)}
function vQuiz(m){
 if(!quiz){const ids=["all",...new Set(QUIZ.map(q=>q.t))];

 ${quiz.ans!==null?`<p class="note" style="margin-top:10px"><b>${q.o[quiz.ans].ok?"Correct.":"Not quite."}</b> ${esc(q.e)}</p><button class="btn" onclick="quiz.i++;quiz.ans=null;render()">${quiz.i+1<quiz.qs.length?"Next question":"See score"}</button>`:""}

 <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Tasks</h2><span class="mute small">${done} of ${TASKS.length} passed</span></div><div class="prog" style="margin:8px 0 12px"><i style="width:${done/TASKS.length*100}%"></i></div>
 <div class="tasklist">${TASKS.map((t,i)=>{const s=taskStatus(e,t);return `<button onclick="evalTask=${i};render();scrollTo(0,0)"><span class="tag">${t.id}</span>${esc(t.title)} <span class="badge ${s}" style="float:right">${s==="pass"?"PASS":s==="fail"?"RETRAIN":"Not done"}</span></button>`}).join("")}</div></div>
 <div class="card noprint"><div class="row"><button class="btn" onclick="printEval()">Print / save record</button><button class="btn sec" onclick="copySummary()">Copy summary</button><button class="btn sec" onclick="archiveEval()">Save &amp; start new</button><button class="btn sec" onclick="if(confirmReset())newEval()">Clear without saving</button></div><p id="cpmsg" class="small mute"></p>
 <p class="small mute">Record pass dates in eServices (task, evaluator CAPID). This app is a guide and does not replace the official SQTR.</p></div>`;
}
function confirmReset(){return window._rc?(window._rc=false,true):(window._rc=true,$("#cpmsg").textContent="Tap “Clear without saving” again to confirm.",false)}
function fld(path,label,type){const e=EV();const v=path.split(".").reduce((o,k)=>o&&o[k],e)||"";return `<div><label>${label}</label><input type="${type||"text"}" value="${esc(v)}" oninput="setF('${path}',this.value)"></div>`}
function setF(path,v){const e=EV();const ks=path.split(".");let o=e;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks.at(-1)]=v;saveEV(e)}
function setPre(id,v){const e=EV();e.prereq[id]=v;saveEV(e)}
function newEval(){saveEV(blankEval());render()}
function archiveEval(){const e=EV();const h=LS("mro_hist")||[];h.unshift({...e,saved:Date.now()});LS("mro_hist",h.slice(0,50));newEval();$("#cpmsg").textContent="Saved to history. New evaluation started."}
function vHistory(m){const h=LS("mro_hist")||[];
 m.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn sec sm" onclick="_instSub=null;render()">← Back</button></div><div class="card"><h2>Saved evaluations</h2>${h.length?`<table class="tbl"><tr><th>Candidate</th><th>Date</th><th>Passed</th><th></th></tr>${h.map((e,i)=>`<tr><td>${esc(e.cand.name||"(no name)")}<br><span class="small mute">${esc(e.cand.capid)}</span></td><td>${esc(e.cand.date)}</td><td>${TASKS.filter(t=>taskStatus(e,t)==="pass").length}/${TASKS.length}</td><td><button class="btn sm" onclick="loadHist(${i})">Open</button> <button class="btn sec sm" onclick="delHist(${i})">Delete</button></td></tr>`).join("")}</table>`:`<p class="mute">No saved evaluations yet.</p>`}<p class="small mute">Opening a saved evaluation replaces the one in progress (save it first if needed).</p></div>`}
function loadHist(i){const h=LS("mro_hist")||[];const e=h.splice(i,1)[0];delete e.saved;LS("mro_hist",h);saveEV(e);_instSub=null;render()}
function delHist(i){const h=LS("mro_hist")||[];h.splice(i,1);LS("mro_hist",h);render()}

function vSettings(m){const s=loadSettings();const f=s.freq||{};
 const F=(k,l)=>`<div><label>${l}</label><input value="${esc(f[k]||"")}" oninput="setFreq('${k}',this.value)" placeholder="channel / frequency – use"></div>`;
 m.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn sec sm" onclick="_instSub=null;render()">← Back</button></div>
 <div class="card"><h2>Change instructor password</h2><div class="grid2"><div><label>Current password</label><input id="p0" type="password"></div><div><label>New password (min 4)</label><input id="p1" type="password"></div><div><label>Repeat new password</label><input id="p2" type="password"></div></div><div style="margin-top:10px"><button class="btn" onclick="chgPw()">Change password</button> <span id="pmsg" class="small"></span></div>
 <p class="small mute">The password is stored as a hash on this device only. It keeps casual users out of instructor mode; it is not strong encryption.</p></div>
 <div class="card"><h2>Local frequency list (L‑0003 answer key)</h2><p class="mute small">Stored only on this device and shown only in instructor mode. Use channel names if you prefer not to store frequencies.</p><div class="grid2">
 ${F("s1","Primary simplex")}${F("s2","Alternate simplex")}${F("d1","Primary duplex pair")}${F("d2","Alternate duplex pair")}${F("h1","Primary HF‑SSB (region)")}${F("h2","Alternate HF‑SSB (region)")}${F("am","VHF‑AM SAR")}${F("oth","Other agencies")}</div></div>`}
function setFreq(k,v){const s=loadSettings();s.freq=s.freq||{};s.freq[k]=v;saveSettings(s)}
function chgPw(){const a=$("#p0").value,b=$("#p1").value,c=$("#p2").value,o=$("#pmsg");
 if(sha256("mro:"+a)!==pwHash()){o.textContent="Current password is wrong.";o.style.color="var(--fail)";return}
 if(b.length<4||b!==c){o.textContent="New passwords must match and be 4+ characters.";o.style.color="var(--fail)";return}
 const s=loadSettings();s.pw=sha256("mro:"+b);saveSettings(s);o.textContent="Password changed.";o.style.color="var(--pass)";["p0","p1","p2"].forEach(i=>$("#"+i).value="")}

function vEvalTask(m){const t=TASKS[evalTask];const e=EV();const r=e.res[t.id]||{};const st=taskStatus(e,t);
 if(t.scenario&&!e.scen[t.id]){e.scen[t.id]=SCEN[t.scenario]();saveEV(e)}
 m.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn sec sm" onclick="evalTask=null;render()">← Task list</button>
 ${evalTask>0?`<button class="btn sec sm" onclick="evalTask--;render();scrollTo(0,0)">‹ Prev</button>`:""}${evalTask<TASKS.length-1?`<button class="btn sec sm" onclick="evalTask++;render();scrollTo(0,0)">Next ›</button>`:""}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0"><span class="tag">${t.id}</span>${esc(t.title)}</h2><span class="badge ${st}">${st==="pass"?"PASS":st==="fail"?"RETRAIN":"In progress"}</span></div>
 <p class="small"><b>Conditions:</b> ${esc(t.cond)}<br><b>Objective:</b> ${esc(t.obj)}</p>
 <h3>① Set up</h3><p>${esc(t.setup)}</p>
 ${t.scenario?`<div class="card" style="background:var(--bg)"><div class="row" style="justify-content:space-between"><b>Scenario${t.scenario==="freq"?" / answer key":""}</b>${t.scenario!=="freq"?`<button class="btn sec sm" onclick="regen()">New scenario</button>`:`<button class="btn sec sm" onclick="_instSub='settings';evalTask=null;render()">Edit list</button>`}</div><div style="margin-top:6px">${t.scenario==="freq"?SCEN.freq():e.scen[t.id]}</div></div>`:""}
 <h3>② Read to the candidate</h3><div class="brief">${esc(t.brief)}</div>
 ${t.timer?`<h3>③ Timer (${t.timer/60} min)</h3><div class="row"><span id="tm" class="timer">${fmt(t.timer)}</span><button class="btn sm" onclick="tStart('${t.id}',${t.timer})">Start</button><button class="btn sec sm" onclick="tStop('${t.id}')">Stop</button><button class="btn sec sm" onclick="tReset('${t.id}',${t.timer})">Reset</button></div>`:""}
 <h3>${t.timer?"④":"③"} Score each performance measure</h3>
 ${t.measures.map((x,i)=>`<div class="meas"><div class="txt">${i+1}. ${esc(x)}</div><div class="pf"><button class="P ${r[i]==="P"?"on":""}" onclick="mark('${t.id}',${i},'P')">P</button><button class="F ${r[i]==="F"?"on":""}" onclick="mark('${t.id}',${i},'F')">F</button></div></div>`).join("")}
 <div class="row" style="margin-top:8px"><button class="btn sec sm" onclick="allPass('${t.id}')">Mark all Pass</button><button class="btn sec sm" onclick="clearT('${t.id}')">Clear</button></div>
 ${st==="fail"?`<p class="note" style="margin-top:10px"><b>Failed measure:</b> show the candidate what was done wrong and how to do it correctly, then re‑evaluate.</p>`:""}
 <details open><summary>What a correct answer looks like</summary><ul class="tight">${t.key.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></details>
 <details><summary>Training points (what the candidate should know)</summary><ul class="tight">${t.know.map(k=>`<li>${esc(k)}</li>`).join("")}</ul><dl class="study">${t.study.map(([h,b])=>`<dt>${h}</dt><dd>${b}</dd>`).join("")}</dl></details>
 <label>Evaluator notes</label><textarea oninput="setNote('${t.id}',this.value)">${esc(e.notes[t.id]||"")}</textarea></div>`;
 if(timers[t.id])tShow(t.id);
}
function regen(){const t=TASKS[evalTask];const e=EV();e.scen[t.id]=SCEN[t.scenario]();saveEV(e);render()}
function mark(id,i,v){const e=EV();e.res[id]=e.res[id]||{};e.res[id][i]=e.res[id][i]===v?undefined:v;e.res[id]["d"]=new Date().toISOString().slice(0,10);saveEV(e);render()}
function allPass(id){const e=EV();const t=TASKS.find(x=>x.id===id);e.res[id]={d:new Date().toISOString().slice(0,10)};t.measures.forEach((_,i)=>e.res[id][i]="P");saveEV(e);render()}
function clearT(id){const e=EV();delete e.res[id];saveEV(e);render()}
function setNote(id,v){const e=EV();e.notes[id]=v;saveEV(e)}
function fmt(s){const n=Math.abs(s);return (s<0?"-":"")+Math.floor(n/60)+":"+pad(n%60)}
function tShow(id){const el=$("#tm");if(!el)return;const T=timers[id];const left=T.run?Math.round(T.left-(Date.now()-T.t0)/1000):T.left;el.textContent=fmt(left);el.classList.toggle("out",left<=0)}
function tStart(id,sec){const T=timers[id]||{left:sec};if(T.run)return;T.run=true;T.t0=Date.now();clearInterval(T.iv);T.iv=setInterval(()=>tShow(id),250);timers[id]=T;tShow(id)}
function tStop(id){const T=timers[id];if(!T||!T.run)return;T.left=Math.round(T.left-(Date.now()-T.t0)/1000);T.run=false;clearInterval(T.iv);tShow(id)}
function tReset(id,sec){const T=timers[id];if(T)clearInterval(T.iv);timers[id]={left:sec};tShow(id)}

function summaryText(){const e=EV();let s=`MRO SQTR EVALUATION\nCandidate: ${e.cand.name} (CAPID ${e.cand.capid})  Unit: ${e.cand.unit}\nDate: ${e.cand.date}  Evaluator: ${e.evaluator.name} (CAPID ${e.evaluator.capid})  Mission: ${e.mission}\n\n`;
 TASKS.forEach(t=>{const st=taskStatus(e,t);s+=`${t.id} ${t.title}: ${st==="pass"?"PASS":st==="fail"?"FAIL – retrain":"not evaluated"}${e.res[t.id]&&e.res[t.id].d?" ("+e.res[t.id].d+")":""}\n`;if(e.notes[t.id])s+=`   Notes: ${e.notes[t.id]}\n`});return s}
function copySummary(){const s=summaryText();const ok=()=>{$("#cpmsg").textContent="Summary copied to clipboard."};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(ok,fallback);else fallback();
 function fallback(){const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(x){}ta.remove()}}
function printEval(){const e=EV();
 $("#printArea").innerHTML=`<h2 style="margin:0">Mission Radio Operator — Task Evaluation Record</h2><p>Candidate: <b>${esc(e.cand.name)}</b> &nbsp; CAPID: ${esc(e.cand.capid)} &nbsp; Unit: ${esc(e.cand.unit)} &nbsp; Date: ${esc(e.cand.date)}<br>Evaluator: ${esc(e.evaluator.name)} &nbsp; CAPID: ${esc(e.evaluator.capid)} &nbsp; Mission/Exercise #: ${esc(e.mission)}</p>
 <p>Prerequisites/records verified: ${SQTR.map(g=>g.items.filter(i=>!/^[LP]-0/.test(i.id))).flat().map(i=>(e.prereq[i.id]?"☑ ":"☐ ")+i.id).join(" &nbsp; ")}</p>
 <table><tr><th>Task</th><th>Performance measures (P/F)</th><th>Result</th><th>Notes</th></tr>${TASKS.map(t=>{const r=e.res[t.id]||{};const st=taskStatus(e,t);return `<tr><td><b>${t.id}</b><br>${esc(t.title)}</td><td>${t.measures.map((x,i)=>`${i+1}. ${esc(x)} — <b>${r[i]||"–"}</b>`).join("<br>")}</td><td><b>${st==="pass"?"PASS":st==="fail"?"FAIL":"—"}</b><br>${r.d||""}</td><td>${esc(e.notes[t.id]||"")}</td></tr>`}).join("")}</table>
 <p style="margin-top:20px">Evaluator signature: ______________________________ &nbsp; Date: ____________</p><p style="font-size:10px">Guide only — enter results in eServices / official SQTR.</p>`;
 if(window.AndroidBridge&&AndroidBridge.print)AndroidBridge.print();else window.print()}

render();
</script>
</body>
</html>
